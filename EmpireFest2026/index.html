<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b2b"><title>Empire Fest 2026 · Jurado</title><link rel="stylesheet" href="styles.css?v=20261012-simple"></head>
<body>
<header class="topbar"><span>Empire Fest 2026</span><button id="logout" class="quiet" hidden>Salir</button></header>
<main>
<section id="login" class="login-layout"><div class="login-card"><h1>Acceso</h1><p>Ingresa tu código de jurado u organización.</p><form id="loginForm"><label for="code">Código de acceso</label><input id="code" type="password" autocomplete="off" required><button class="primary" type="submit">Entrar</button></form><p id="loginStatus" role="status"></p></div></section>
<section id="workspace" hidden><div class="page-heading"><div><p class="eyebrow" id="modeLabel"></p><h1 id="welcome"></h1><p id="specialty"></p></div><div class="connection" id="connection">Conectado</div></div><nav id="navigation"></nav><div id="view"></div></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="confirm"><h2 id="confirmTitle">Publicar evaluación</h2><p id="confirmText"></p><div class="actions"><button id="cancelConfirm" class="outline">Cancelar</button><button id="acceptConfirm" class="primary">Confirmar publicación</button></div></dialog>
<script type="module" src="app.js?v=20261012-simple"></script>
</body></html>
