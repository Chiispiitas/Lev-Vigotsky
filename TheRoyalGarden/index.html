<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#243825">
<title>The Royal Garden · Reinado UEPLV</title>
<link rel="icon" href="./ueplv.svg">
<link rel="stylesheet" href="./style.css?v=garden3">
</head>
<body>
<header class="topbar"><div class="shell bar">
  <div class="brand"><img src="./ueplv.svg" alt="" width="40" height="40"><span>Reinado Lev Vigotsky<small>2026–2027</small></span></div>
  <button id="logout" class="secondary" type="button" hidden>Cerrar sesión</button>
</div></header>
<main class="shell">
  <section id="login" class="entry">
    <div class="garden-art" aria-hidden="true"></div>
    <div class="signin">
      <h1><img class="wordmark" src="./marca-transparente.webp" alt="The Royal Garden"></h1>
      <h2>Acceso al jurado y a Organización</h2>
      <form id="loginForm">
        <label for="code">Código personal</label>
        <input id="code" type="password" placeholder="Ingresa tu código" autocapitalize="none" autocomplete="off" spellcheck="false" required>
        <button type="submit">Ingresar</button>
      </form>
      <p id="loginStatus" class="status" role="status"></p>
    </div>
  </section>
  <section id="workspace" hidden>
    <div class="workspace-top"><div><p class="kicker" id="panel"></p><h1 id="welcome"></h1></div><button class="secondary" id="refresh">Recargar</button></div>
    <nav id="tabs" aria-label="Fases de evaluación"></nav>
    <p id="notice" class="status" role="status"></p>
    <div id="view"></div>
  </section>
</main>
<script type="module" src="./app.mjs?v=garden2"></script>
</body>
</html>
