<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Practice Results | Lev Vigotsky</title>
  <link rel="icon" href="../assets/site/school-emblem.webp">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="exam-player.css">
</head>
<body class="english-page">
  <header class="english-header">
    <a class="brand" href="./"><img src="../assets/site/school-emblem.webp" width="66" height="48" alt=""><span class="brand-copy"><span class="brand-name">Lev Vigotsky</span><span class="brand-description">Private School</span></span></a>
    <a class="text-link" href="./">Back</a>
  </header>
  <main class="english-main">
    <h1>Practice Results</h1>
    <section class="material-block">
      <p>Sign in to Wix and export the practice attempts as a CSV. Import the file here to review student answers by question. The file stays in your browser.</p>
      <p><a id="openCms" class="button primary" href="#" target="_blank" rel="noopener" hidden>Open Wix CMS</a></p>
      <p><label for="resultsFile">Results file</label> <input type="file" accept=".csv,.json,text/csv,application/json" id="resultsFile"></p>
      <p id="resultsStatus" role="status"></p>
    </section>
    <section id="teacherResults" class="material-block" hidden>
      <div class="teacher-filters">
        <label>Exam <select id="examSelect"><option value="">All exams</option></select></label>
        <label>Group <select id="classIdInput"><option value="">All groups</option><option value="science">Science</option><option value="technical">Technical</option></select></label>
        <label>Student <input id="studentInput" type="search" placeholder="Search by name"></label>
      </div>
      <p><button type="button" class="button outline" id="downloadPngBtn">Download summary PNG</button></p>
      <div class="teacher-table"><table><thead><tr><th>Student</th><th>Exam</th><th>Group</th><th>Score</th><th>Date</th><th></th></tr></thead><tbody id="resultsBody"></tbody></table></div>
    </section>
    <section id="teacherDetails" class="material-block" hidden>
      <button type="button" class="button outline" id="downloadDetailsPngBtn">Download answers PNG</button>
      <div id="detailsContent" class="review-list"></div>
    </section>
    <p id="toast" class="toast" role="status"></p>
  </main>
  <script src="config.js"></script>
  <script defer src="results-png.js"></script>
  <script type="module" src="results.js"></script>
</body>
</html>
