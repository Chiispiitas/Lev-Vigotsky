<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>Chat del laboratorio</title>
<style>
:root{color-scheme:light;font:14px 'Segoe UI',Arial,sans-serif;color:#24365f;background:#faf9f6}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,select,textarea{font:inherit;color:inherit;border:0}button{cursor:pointer;background:#f1f3f7;border-radius:12px;padding:11px 16px;font-weight:600}button:hover{background:#e7eaf0}button:disabled{opacity:.45;cursor:default}.gold{background:#f8bc3c}.gold:hover{background:#efb230}header{height:83px;display:flex;align-items:center;justify-content:space-between;padding:20px 26px;gap:18px}h1{font-size:22px;margin:0}small{color:#666a72}main{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 83px);gap:16px;padding:0 18px 18px}.side,.chat{background:white;border-radius:20px;overflow:hidden}.side{padding:18px 12px;overflow:auto}.side h2{font-size:13px;padding:0 10px;margin:0 0 14px;color:#666a72}.contact{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:12px;cursor:pointer}.contact:hover,.contact.active{background:#f1f3f7}.contact input{accent-color:#d59920;width:16px;height:16px}.avatar{width:34px;height:34px;border-radius:11px;background:#fff3d2;display:grid;place-items:center;font-weight:700}.chat{display:flex;flex-direction:column}.heading{display:flex;justify-content:space-between;align-items:center;padding:19px 24px;background:#fff;gap:12px}.heading strong{font-size:16px}.tools{display:flex;gap:8px;align-items:center}select{padding:10px;border-radius:10px;background:#f1f3f7;max-width:220px}#messages{flex:1;overflow:auto;padding:12px 26px}.msg{margin:0 0 20px;max-width:80%}.msg.mine{margin-left:auto}.author{font-size:12px;color:#666a72;margin-bottom:6px}.bubble{background:#f1f3f7;border-radius:4px 16px 16px;padding:13px 17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.mine .bubble{background:#fff1ce;border-radius:16px 4px 16px 16px}.compose{margin:12px 22px 22px;background:#f6f7fa;border-radius:16px;padding:14px;display:flex;align-items:flex-end;gap:12px}textarea{background:transparent;resize:none;min-height:65px;max-height:150px;flex:1;outline:none}#status{font-size:12px;color:#666a72;max-width:420px}#error{padding:0 24px;color:#a32e36;min-height:18px}#summary{font-size:12px;color:#666a72;margin-top:4px}@media(max-width:720px){main{grid-template-columns:175px 1fr;padding:0 8px 8px;gap:8px}.tools{flex-wrap:wrap}.heading{padding:14px}.msg{max-width:95%}header{padding:15px}.compose{margin:10px}.side{padding:12px 5px}}
</style>
<header><div><h1>Chat del laboratorio</h1><small id="status">Conectando…</small></div><button class="gold" id="announcement" hidden>Anuncio a todos</button></header>
<main><aside class="side"><h2>Conversaciones</h2><div id="contacts"></div></aside><section class="chat"><div class="heading"><div><strong id="title">Docente</strong><div id="summary"></div></div><div class="tools" id="controls" hidden><select id="mode"><option value="teacher-only">Solo docente</option><option value="teacher-student">Docente ↔ estudiantes</option><option value="students">Entre estudiantes</option></select><button id="apply">Aplicar</button></div></div><div id="messages"></div><div id="error"></div><form class="compose" id="compose"><textarea id="text" maxlength="2000" placeholder="Escribe un mensaje…" aria-label="Mensaje"></textarea><button class="gold" id="send">Enviar</button></form></section></main>
<script>
let state=null,selected=new Set(),active='teacher',draftId=null,draftText='',last='';const $=id=>document.getElementById(id),label=n=>n==='teacher'?'Docente':n.replace('UEPLV-','PC ');const post=data=>window.chrome.webview.postMessage(data);
function recipients(){return [...selected]}function update(){if(!state)return;const teacher=state.teacher,chosen=recipients();$('title').textContent=chosen.length>1?'Mensaje individual a '+chosen.length+' equipos':chosen.length===0?'Selecciona destinatarios':label(active);$('summary').textContent=teacher&&chosen.length>1?chosen.map(label).join(', '):'';const c=state.contacts.find(c=>c.name===active);const enabled=teacher?chosen.length>0:!!c?.canSend;$('send').disabled=$('text').disabled=!enabled;$('text').placeholder=enabled?'Escribe un mensaje…':'Solo mensajes del docente';$('contacts').replaceChildren();for(const c of state.contacts){let row=document.createElement('div');row.className='contact'+(c.name===active?' active':'');if(teacher){const box=document.createElement('input');box.type='checkbox';box.checked=selected.has(c.name);box.setAttribute('aria-label',label(c.name));box.onclick=e=>{e.stopPropagation();if(box.checked)selected.add(c.name);else selected.delete(c.name);update()};row.append(box)}let avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=c.name==='teacher'?'D':c.name.slice(-2);let name=document.createElement('span');name.textContent=label(c.name);row.append(avatar,name);row.onclick=()=>{active=c.name;selected=new Set([c.name]);update()};$('contacts').append(row)}const messages=state.messages.filter(m=>m.from===active||m.to===active);const signature=JSON.stringify([active,messages]);if(last!==signature){last=signature;$('messages').replaceChildren();for(const m of messages){let node=document.createElement('article');node.className='msg'+(m.from===state.name?' mine':'');let author=document.createElement('div');author.className='author';author.textContent=label(m.from)+' · '+new Date(m.utc).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});let bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;node.append(author,bubble);$('messages').append(node)}$('messages').scrollTop=$('messages').scrollHeight}}
window.chrome.webview.addEventListener('message',event=>{const data=event.data;if(data.type==='error'){$('error').textContent=data.message;$('send').disabled=false;return}if(data.type==='sent'){$('text').value='';draftId=null;$('error').textContent='';return}if(data.type==='state'){let fresh=!state||data.selectionRevision!==state.selectionRevision;state=data;if(fresh){selected=new Set(data.teacher?data.targets:['teacher']);active=[...selected][0]||'teacher';$('mode').value=data.currentMode||'teacher-only'}else selected=new Set([...selected].filter(n=>data.contacts.some(c=>c.name===n)));$('controls').hidden=$('announcement').hidden=!data.teacher;$('status').textContent=data.connected?'Conectado':'Sin conexión';update()}});
$('announcement').onclick=()=>{post({op:'announcement'});$('text').focus()};$('apply').onclick=()=>post({op:'configure',mode:$('mode').value,targets:recipients()});$('compose').onsubmit=e=>{e.preventDefault();const text=$('text').value;if(!text.trim()||$('send').disabled)return;const key=JSON.stringify([recipients(),text]);if(key!==draftText){draftText=key;draftId=typeof crypto.randomUUID==='function'?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}$('send').disabled=true;post({op:'send',recipients:recipients(),text,requestId:draftId})};$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('compose').requestSubmit()}};post({op:'ready'});
</script></html>
